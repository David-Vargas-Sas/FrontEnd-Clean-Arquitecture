<div class="pagination"><span>@if (count) { Mostrando {{ offset + 1 }}–{{ offset + count }} } @else { Sin registros }<span class="pagination-size"> · {{ size }} por página</span></span><div><button type="button" class="button secondary small" (click)="pageChange.emit(-1)" [disabled]="offset === 0 || loading">Anterior</button><span class="page-number">{{ pageNumber }}</span><button type="button" class="button secondary small" (click)="pageChange.emit(1)" [disabled]="!hasNext || loading">Siguiente</button></div></div>
